# vLLM / SGLang NIXL disaggregation sanity matrix — x86_64 on the mizu SLURM cluster.
#
# Mirrors test-matrix.yaml (same mizu/scctl allocate-run-stop pattern). The aarch64
# counterpart lives in test-vllm-sglang-dl-matrix.yaml (dlcluster / GB200). One file per
# cluster: the ci-demo framework drives a single SLURM target per file, so per-cluster
# auth and teardown stay clean.
#
# Consumes the per-PR image built+pushed by nixl-ci-build-wheel:
#   <registry>/ci/pr/x86_64/<framework>-nixl:<sha1>
#
# Note: changes to this file are tested as part of the PR CI flow.

---
job: nixl-ci-vllm-sglang

failFast: false
timeout_minutes: 120

registry_host: artifactory.nvidia.com
registry_auth: svc-nixl-new-artifactory-token
registry_path: /sw-nbu-swx-nixl-docker-local/ci

kubernetes:
  cloud: il-ipp-blossom-prod
  namespace: nbu-swx-nixl
  imagePullSecrets: "['artifactory-pull-secret']"
  limits: "{memory: 16Gi, cpu: 16000m}"
  requests: "{memory: 8Gi, cpu: 8000m}"
  privileged: true

credentials:
  - {credentialsId: 'svc-nixl-new-artifactory-token', usernameVariable: 'REPO_USER', passwordVariable: 'REPO_PASS'}

env:
  ARTIFACTORY_PATH: /sw-nbu-swx-nixl-docker-local/ci
  SLURM_NODES: 1
  SLURM_PARTITION: mizu
  SLURM_HEAD_NODE: scctl
  SLURM_GRES: gpu:2
  SLURM_MEM: 128G
  SLURM_MINCPUS: 24
  SLURM_JOB_TIMEOUT: '01:30:00'
  SLURM_IMMEDIATE_TIMEOUT: "3600"
  SCCTL_CREDENTIALS_ID: 'svc-nixl-scctl'
  JOB_ID_FILE_ROOT: "/mnt/pvc/${JOB_BASE_NAME}"
  STORAGE_DRIVER: overlay
  CI_IMAGE_TAG: "20260604-1"

empty_volumes:
  - {mountPath: /root, memory: false}
  - {mountPath: /var/lib/containers/storage, memory: false}

pvc_volumes:
  - {claimName: nbu-swx-nixl-pvc, mountPath: /mnt/pvc, readOnly: false}

runs_on_dockers:
  - {
      file: '.ci/dockerfiles/Dockerfile.build_helper',
      name: 'build_helper',
      tag: "${CI_IMAGE_TAG}",
      build_args: '--build-arg BASE_IMAGE=dockerhub.nvidia.com/ubuntu:24.04'
    }

matrix:
  axes:
    arch:
      - x86_64
    framework:
      - vllm
      - sglang

taskName: "${framework}/${arch}/${axis_index}"

steps:
  - name: Allocate Environment
    containerSelector: "{name: 'build_helper'}"
    parallel: false
    shell: action
    module: slurmCI
    run: allocation
    args:
      partition: "${SLURM_PARTITION}"
      headNode: "${SLURM_HEAD_NODE}"
      nodes: "${SLURM_NODES}"
      jobTimeout: "${SLURM_JOB_TIMEOUT}"
      immediateTimeout: "${SLURM_IMMEDIATE_TIMEOUT}"
      jobName: "nixl-vs-${framework}-${BUILD_NUMBER}"
      jobIdFile: "${JOB_ID_FILE_ROOT}/job_id_${framework}_${BUILD_NUMBER}.txt"
      credentialsId: "${SCCTL_CREDENTIALS_ID}"
      extraArgs: [
        "--gres=${SLURM_GRES}",
        "--mincpus=${SLURM_MINCPUS}",
        "--mem=${SLURM_MEM}"
      ]

  - name: Run vLLM/SGLang sanity
    containerSelector: "{name: 'build_helper'}"
    timeout: 40
    parallel: false
    shell: action
    module: slurmCI
    run: run
    args:
      jobIdFile: "${JOB_ID_FILE_ROOT}/job_id_${framework}_${BUILD_NUMBER}.txt"
      testScript: ".gitlab/test_vllm_sglang_sanity.sh ${framework}"
      headNode: "${SLURM_HEAD_NODE}"
      dockerImage: "${registry_host}#${ARTIFACTORY_PATH}/pr/${arch}/${framework}-nixl:${sha1}"
      credentialsId: "${SCCTL_CREDENTIALS_ID}"
      containerName: "nixl-vs-${framework}-${BUILD_NUMBER}"

pipeline_stop:
  containerSelector: "{name: 'build_helper'}"
  parallel: false
  shell: action
  module: slurmCI
  run: stopAllForBuild
  args:
    credentialsId: "${SCCTL_CREDENTIALS_ID}"
    headNode: "${SLURM_HEAD_NODE}"
    jobIdDir: "${JOB_ID_FILE_ROOT}"
