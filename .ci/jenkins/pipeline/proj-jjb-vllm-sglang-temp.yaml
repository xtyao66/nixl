# TEMPORARY standalone JJB definition for the two new vLLM/SGLang NIXL sanity jobs.
#
# Purpose: create ONLY `nixl-ci-vllm-sglang` (mizu/x86_64) and `nixl-ci-vllm-sglang-dl`
# (dlcluster/aarch64) in Jenkins so they can be run MANUALLY (set the `sha1` parameter to
# the commit under test), WITHOUT applying the dispatcher changes in proj-jjb.yaml — so
# current PR builds are unaffected.
#
# Apply with, e.g.:
#   jenkins-jobs --conf <your.ini> update .ci/jenkins/pipeline/proj-jjb-vllm-sglang-temp.yaml
# (do NOT pass --delete-old, or it would prune jobs not defined in this file)
#
# Once validated, fold these two job-templates + the dispatcher chain into the real
# proj-jjb.yaml (already prepared there) and delete this file.

# --- mizu / x86_64 ---------------------------------------------------------------
- job-template:
    name: "{jjb_proj}-vllm-sglang"      # -> nixl-ci-vllm-sglang
    project-type: pipeline
    disabled: false
    properties:
        - github:
            url: "{jjb_gh_url}"
        - build-discarder:
            days-to-keep: 14
            num-to-keep: 1000
        - inject:
            keep-system-variables: true
            properties-content: |
              jjb_proj={jjb_proj}-vllm-sglang
    description: Do NOT edit this job through the Web GUI !
    concurrent: true
    sandbox: true
    parameters:
        - string:
            name: "sha1"
            default: "{jjb_branch}"
            description: "Commit to be checked, usually set by PR. For manual runs, paste the commit SHA here."
        - string:
            name: "githubData"
            default: ""
            description: "Variables from post (leave empty for manual runs)"
        - string:
            name: "conf_file"
            default: ".ci/jenkins/lib/test-vllm-sglang-matrix.yaml"  # mizu / x86_64
            description: "Job config file"
        - bool:
            name: "build_dockers"
            default: false
            description: "Force rebuild docker containers"
        - string:
            name: "DEBUG"
            default: 0
            description: "Enable debug prints and traces, valid values are 0-9"
    pipeline-scm:
        scm:
            - git:
                url: "{jjb_git}"
                branches: ['$sha1']
                shallow-clone: false
                do-not-fetch-tags: false
                refspec: "{jjb_gh_refspec}"
                browser: githubweb
                browser-url: "{jjb_git}"
                submodule:
                    disable: false
                    recursive: true
                    tracking: true
                    parent-credentials: true
        script-path: "{jjb_jenkinsfile}"

# --- dlcluster / GB200 / aarch64 -------------------------------------------------
- job-template:
    name: "{jjb_proj}-vllm-sglang-dl"   # -> nixl-ci-vllm-sglang-dl
    project-type: pipeline
    disabled: false
    properties:
        - github:
            url: "{jjb_gh_url}"
        - build-discarder:
            days-to-keep: 14
            num-to-keep: 1000
        - inject:
            keep-system-variables: true
            properties-content: |
              jjb_proj={jjb_proj}-vllm-sglang-dl
    description: Do NOT edit this job through the Web GUI !
    concurrent: true
    sandbox: true
    parameters:
        - string:
            name: "sha1"
            default: "{jjb_branch}"
            description: "Commit to be checked, usually set by PR. For manual runs, paste the commit SHA here."
        - string:
            name: "githubData"
            default: ""
            description: "Variables from post (leave empty for manual runs)"
        - string:
            name: "conf_file"
            default: ".ci/jenkins/lib/test-vllm-sglang-dl-matrix.yaml"  # dlcluster / aarch64
            description: "Job config file"
        - bool:
            name: "build_dockers"
            default: false
            description: "Force rebuild docker containers"
        - string:
            name: "DEBUG"
            default: 0
            description: "Enable debug prints and traces, valid values are 0-9"
    pipeline-scm:
        scm:
            - git:
                url: "{jjb_git}"
                branches: ['$sha1']
                shallow-clone: false
                do-not-fetch-tags: false
                refspec: "{jjb_gh_refspec}"
                browser: githubweb
                browser-url: "{jjb_git}"
                submodule:
                    disable: false
                    recursive: true
                    tracking: true
                    parent-credentials: true
        script-path: "{jjb_jenkinsfile}"

# --- project: instantiate ONLY these two jobs ------------------------------------
- project:
    name: nixl-vllm-sglang-temp
    jjb_proj: 'nixl-ci'
    jjb_git: 'https://github.com/ai-dynamo/nixl.git'
    jjb_jenkinsfile: '.ci/jenkins/pipeline/Jenkinsfile'
    jjb_branch: 'main'
    jjb_gh_url: 'https://github.com/ai-dynamo/nixl'
    jjb_gh_refspec: '+refs/heads/*:refs/remotes/origin/* +$sha1:refs/remotes/origin/$sha1'
    jobs:
        - "{jjb_proj}-vllm-sglang"
        - "{jjb_proj}-vllm-sglang-dl"
